openapi: 3.1.0
info:
  title: K8s Namespace Service
  description: A service that fetches Kubernetes namespaces based on label selectors
  version: 1.0.0
  contact:
    name: K8s Team
    email: k8s-team@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8081/api/v1
    description: Development server
  - url: https://k8s-service-provider.example.com:8081/api/v1
    description: Production server

paths:
  /namespaces:
    get:
      summary: List namespaces by labels
      description: Returns a list of Kubernetes namespaces that match the provided label selectors
      operationId: ListNamespaces
      parameters:
        - name: filter
          in: query
          description: |
            Label selector filter string. Comma-separated key=value pairs.
            Example: environment=production,team=backend
          schema:
            type: string
          examples:
            simple:
              summary: Simple label selector
              value: "environment=production,team=backend"
            multiple:
              summary: Multiple label selectors
              value: "environment=staging,app=web-service,version=v1.2.3"
        - name: max_page_size
          in: query
          description: Maximum number of namespaces to return per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: page_token
          in: query
          description: Token for retrieving the next page of results
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved namespaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Namespace'
                  next_page_token:
                    type: string
                    description: Token for the next page of results
              examples:
                success:
                  summary: Successful response
                  value:
                    results:
                      - path: "namespaces/production-backend"
                        name: production-backend
                        labels:
                          environment: production
                          team: backend
                          created-by: ops
                      - path: "namespaces/prod-api"
                        name: prod-api
                        labels:
                          environment: production
                          team: backend
                          service: api
                    next_page_token: ""
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_labels:
                  summary: Invalid label format
                  value:
                    code: "INVALID_ARGUMENT"
                    message: "Labels cannot be empty"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                k8s_error:
                  summary: Kubernetes API error
                  value:
                    code: "INTERNAL"
                    message: "Failed to fetch namespaces"

  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the namespace service
      operationId: HealthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - check_time
                properties:
                  status:
                    type: string
                    enum: [healthy, unhealthy]
                  check_time:
                    type: string
                    format: date-time
              examples:
                healthy:
                  summary: Healthy service
                  value:
                    status: "healthy"
                    check_time: "2024-01-15T10:30:00Z"
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    format: uri-reference
                  status:
                    type: string
                    enum: [healthy, unhealthy]
                  check_time:
                    type: string
                    format: date-time
                  error:
                    type: string
              examples:
                unhealthy:
                  summary: Unhealthy service
                  value:
                    status: "unhealthy"
                    check_time: "2024-01-15T10:30:00Z"
                    error: "Cannot connect to Kubernetes cluster"

components:
  schemas:
    Namespace:
      type: object
      x-aep-resource:
        type: "k8s-service-provider/namespace"
        singular: "namespace"
        plural: "namespaces"
        patterns:
          - "namespaces/{namespace}"
      required:
        - name
        - labels
      properties:
        path:
          type: string
          readOnly: true
          description: "Resource path. Format: namespaces/{namespace}"
          example: "namespaces/production-backend"
        name:
          type: string
          description: The name of the namespace
          example: "production-backend"
        labels:
          type: object
          additionalProperties:
            type: string
          description: All labels on the namespace
          example:
            environment: production
            team: backend
            created-by: ops

    Error:
      type: object
      required:
        - code
        - message
      properties:
        type:
          type: string
          format: uri-reference
          description: Error type identifier
        code:
          type: string
          description: Error code
          example: "INVALID_ARGUMENT"
        message:
          type: string
          description: Detailed error message
          example: "Labels cannot be empty"
